<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="970" viewBox="0 0 1560 970" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Mock Lab Booking Agent architecture</title>
  <desc id="desc">A user request enters a LangGraph agent. The model chooses tools. Booking calls pause for user approval before running; other tool calls run directly. Tools read or update mock JSON data and return results to the agent. When no more tools are needed, the agent returns a final answer. A declined booking returns to the agent without creating a booking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="tools" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312e81" flood-opacity=".12"/>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#059669"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .label { font-size: 16px; font-weight: 700; fill: #4338ca; letter-spacing: .06em; }
      .title { font-size: 30px; font-weight: 700; fill: #172554; }
      .sub { font-size: 17px; fill: #475569; }
      .card-title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .card-copy { font-size: 15px; fill: #475569; }
      .white-title { font-size: 21px; font-weight: 700; fill: #fff; }
      .white-copy { font-size: 15px; fill: #ede9fe; }
      .edge-label { font-size: 14px; font-weight: 700; fill: #475569; }
      .pill { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1560" height="970" rx="32" fill="url(#bg)"/>
  <circle cx="1440" cy="100" r="120" fill="#ddd6fe" opacity=".45"/>
  <circle cx="90" cy="890" r="150" fill="#bae6fd" opacity=".35"/>

  <text x="72" y="78" class="title">How the Mock Lab Booking Agent Works</text>
  <text x="72" y="110" class="sub">The model chooses the next tool; Python validates the booking rules and mock data.</text>

  <!-- Workflow container -->
  <rect x="40" y="150" width="1480" height="490" rx="28" fill="#ffffff" opacity=".68" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="9 9"/>
  <rect x="66" y="132" width="262" height="38" rx="19" fill="#e0e7ff"/>
  <text x="86" y="157" class="label">LANGGRAPH WORKFLOW</text>

  <!-- ===== Connectors (drawn first, under cards) ===== -->
  <!-- main flow -->
  <path d="M242 350H299" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M562 350H623" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M846 350H963" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M1196 350H1257" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow-teal)"/>

  <!-- other tool: bypass over the approval gate -->
  <path d="M736 262V234H1300V259" fill="none" stroke="#0f766e" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>

  <!-- tool results return to agent -->
  <path d="M1380 262V200H432V259" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>

  <!-- final answer -->
  <path d="M432 438V517" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>

  <!-- declined booking returns to agent -->
  <path d="M1081 438V500H594V408H565" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>

  <!-- tools <-> data -->
  <path d="M1340 438V687" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <path d="M1420 689V441" fill="none" stroke="#0891b2" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-teal)"/>

  <!-- ===== Cards ===== -->
  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="72" y="262" width="170" height="176" rx="24" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
  </g>
  <g transform="translate(-9 -5)">
    <circle cx="166" cy="315" r="24" fill="#ede9fe"/>
    <circle cx="166" cy="308" r="8" fill="#7c3aed"/>
    <path d="M150 333c2-11 9-16 16-16s14 5 16 16" fill="#7c3aed"/>
  </g>
  <text x="157" y="382" class="card-title" text-anchor="middle">User request</text>
  <text x="157" y="407" class="card-copy" text-anchor="middle">Natural language</text>

  <!-- Agent -->
  <g filter="url(#shadow)">
    <rect x="302" y="262" width="260" height="176" rx="24" fill="url(#agent)"/>
  </g>
  <g transform="translate(-17 -5)">
    <circle cx="449" cy="315" r="24" fill="#ffffff" opacity=".19"/>
    <path d="M437 316c0-8 5-13 12-13s12 5 12 13v8h-24z" fill="none" stroke="#fff" stroke-width="3"/>
    <circle cx="444" cy="316" r="2.5" fill="#fff"/><circle cx="454" cy="316" r="2.5" fill="#fff"/>
    <path d="M443 324h12M449 302v-5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="432" y="382" class="white-title" text-anchor="middle">Agent + LLM</text>
  <text x="432" y="407" class="white-copy" text-anchor="middle">Chooses tools and next step</text>

  <!-- Router -->
  <g filter="url(#shadow)">
    <rect x="626" y="262" width="220" height="176" rx="24" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
  </g>
  <g transform="translate(15 -5)">
    <path d="M704 305h34l-17 20z" fill="#8b5cf6"/>
    <path d="M721 325v19m0 0h-17m17 0h17" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="704" cy="344" r="5" fill="#f59e0b"/><circle cx="738" cy="344" r="5" fill="#14b8a6"/>
  </g>
  <text x="736" y="382" class="card-title" text-anchor="middle">Route call</text>
  <text x="736" y="407" class="card-copy" text-anchor="middle">Booking or other tool?</text>

  <!-- Approval -->
  <g filter="url(#shadow)">
    <rect x="966" y="262" width="230" height="176" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  </g>
  <g transform="translate(119 -5)">
    <circle cx="962" cy="315" r="24" fill="#ffedd5"/>
    <path d="M962 301l15 6v10c0 10-7 16-15 20-8-4-15-10-15-20v-10z" fill="none" stroke="#ea580c" stroke-width="3"/>
    <path d="M955 316l5 5 10-11" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1081" y="382" class="card-title" text-anchor="middle">User approval</text>
  <text x="1081" y="407" class="card-copy" text-anchor="middle">Required before booking</text>

  <!-- Tools -->
  <g filter="url(#shadow)">
    <rect x="1260" y="262" width="240" height="176" rx="24" fill="url(#tools)"/>
  </g>
  <g transform="translate(145 -5)">
    <circle cx="1235" cy="315" r="24" fill="#ffffff" opacity=".18"/>
    <path d="M1235 299a9 9 0 0 0-7 15l-13 13 9 9 13-13a9 9 0 0 0 11-12l-6 6-7-7 6-6a9 9 0 0 0-6-5z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <text x="1380" y="382" class="white-title" text-anchor="middle">Tool functions</text>
  <text x="1380" y="407" class="white-copy" text-anchor="middle">Search · check</text>
  <text x="1380" y="427" class="white-copy" text-anchor="middle">book · confirm</text>

  <!-- Final response -->
  <g filter="url(#shadow)">
    <rect x="302" y="520" width="260" height="96" rx="22" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  </g>
  <g transform="translate(-37 14)">
    <path d="M361 544h25v20h-25zM361 544l12 10 13-10" fill="none" stroke="#059669" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <text x="366" y="561" class="card-title">Final response</text>
  <text x="366" y="587" class="card-copy">Summary or clarification</text>

  <!-- Data store -->
  <g filter="url(#shadow)">
    <rect x="1220" y="690" width="280" height="156" rx="24" fill="#fff" stroke="#67e8f9" stroke-width="2"/>
  </g>
  <g transform="translate(111 58)">
    <ellipse cx="1249" cy="675" rx="29" ry="10" fill="#cffafe" stroke="#0891b2" stroke-width="2.5"/>
    <path d="M1220 675v35c0 6 13 11 29 11s29-5 29-11v-35M1220 693c0 6 13 11 29 11s29-5 29-11" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  </g>
  <text x="1360" y="810" class="card-title" text-anchor="middle">mock_data.json</text>
  <text x="1360" y="834" class="card-copy" text-anchor="middle">Reports · labs · slots · bookings</text>

  <!-- ===== Edge labels (on top of lines) ===== -->
  <rect class="pill" x="761" y="188" width="260" height="24" rx="12"/>
  <text x="891" y="205" class="edge-label" text-anchor="middle">tool results return to agent</text>

  <rect class="pill" x="965" y="222" width="106" height="24" rx="12"/>
  <text x="1018" y="239" class="edge-label" text-anchor="middle" style="fill:#0f766e">other tool</text>

  <text x="905" y="338" class="edge-label" text-anchor="middle" style="fill:#6d28d9">booking call</text>

  <rect class="pill" x="705" y="488" width="200" height="24" rx="12"/>
  <text x="805" y="505" class="edge-label" text-anchor="middle">declined: no booking</text>

  <text x="1326" y="568" class="edge-label" text-anchor="end" style="fill:#0f766e">read / update</text>

  <!-- ===== Legend ===== -->
  <rect x="72" y="884" width="1416" height="54" rx="18" fill="#ffffff" opacity=".78"/>
  <circle cx="105" cy="911" r="7" fill="#7c3aed"/>
  <text x="122" y="917" class="card-copy">LLM decision</text>
  <circle cx="295" cy="911" r="7" fill="#0f766e"/>
  <text x="312" y="917" class="card-copy">Tool/data flow</text>
  <circle cx="505" cy="911" r="7" fill="#ea580c"/>
  <text x="522" y="917" class="card-copy">Human approval gate</text>
  <path d="M740 911h48" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="800" y="917" class="card-copy">Alternative / return path</text>
  <text x="1464" y="917" class="card-copy" text-anchor="end">Mock workflow · no real appointment is created</text>
</svg>
